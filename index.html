<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube DL — THE CRIS IF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --r: #ff0033;
  --r2: #ff4d6a;
  --r3: #ff8fa3;
  --y: #ffcc00;
  --y2: #ffe066;
  --w: #ff6b35;
  --bg:  #08080f;
  --bg2: #0f0f1a;
  --bg3: #161625;
  --bg4: #1c1c30;
  --line: rgba(255,255,255,0.06);
  --txt:  rgba(255,255,255,0.93);
  --txt2: rgba(255,255,255,0.48);
  --txt3: rgba(255,255,255,0.18);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  min-height:100vh;
  color:var(--txt);
  display:flex;flex-direction:column;align-items:center;
  padding:36px 16px 100px;
  overflow-x:hidden;
}

/* ORBS */
.bg-orb{position:fixed;pointer-events:none;border-radius:50%;filter:blur(80px);z-index:0}
.bg-orb-1{
  width:400px;height:400px;top:-100px;left:-80px;
  background:radial-gradient(circle,rgba(255,0,51,0.16),transparent 70%);
  animation:drift1 12s ease-in-out infinite alternate;
}
.bg-orb-2{
  width:320px;height:320px;top:45%;right:-60px;
  background:radial-gradient(circle,rgba(255,204,0,0.11),transparent 70%);
  animation:drift2 10s ease-in-out infinite alternate;
}
.bg-orb-3{
  width:260px;height:260px;bottom:12%;left:8%;
  background:radial-gradient(circle,rgba(255,107,53,0.09),transparent 70%);
  animation:drift1 14s ease-in-out infinite alternate-reverse;
}
@keyframes drift1{from{transform:translate(0,0)}to{transform:translate(28px,18px)}}
@keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-22px,14px)}}

/* Noise */
body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  opacity:0.025;pointer-events:none;z-index:0;
}

/* HEADER */
.header{
  position:relative;z-index:2;
  text-align:center;margin-bottom:36px;
  animation:fadeDown .8s cubic-bezier(.16,1,.3,1) both;
}
@keyframes fadeDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}

.logo{
  width:72px;height:72px;margin:0 auto 16px;
  position:relative;
  animation:popIn .7s cubic-bezier(.34,1.56,.64,1) .15s both;
}
@keyframes popIn{from{transform:scale(.3) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}

.logo-bg{
  position:absolute;inset:0;border-radius:22px;
  background:linear-gradient(135deg,var(--r) 0%,var(--w) 50%,var(--y) 100%);
  animation:hueSpin 8s linear infinite;
}
@keyframes hueSpin{to{filter:hue-rotate(30deg)}}

.logo-face{
  position:absolute;inset:3px;border-radius:18px;
  background:var(--bg2);
  display:flex;align-items:center;justify-content:center;
  font-size:1.9rem;z-index:1;
}

.brand{
  font-family:'Syne',sans-serif;
  font-size:clamp(2.6rem,10vw,4.2rem);
  font-weight:800;line-height:.95;letter-spacing:-.02em;
  background:linear-gradient(120deg,#fff 0%,var(--y2) 30%,var(--r2) 65%,var(--r) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 32px rgba(255,0,51,.28));
}

.tagline{
  margin-top:6px;font-size:.72rem;font-weight:600;
  letter-spacing:.3em;text-transform:uppercase;color:var(--txt3);
}

.pills{
  display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:16px;
}
.pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 14px;border-radius:100px;
  font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid rgba(255,255,255,.09);
  background:rgba(255,255,255,.04);color:var(--txt2);
  transition:all .2s;
}
.pill:hover{border-color:rgba(255,0,51,.35);color:var(--r2)}

/* CARD */
.card{
  position:relative;z-index:2;
  width:100%;max-width:580px;
  background:var(--bg2);border:1px solid var(--line);border-radius:24px;
  padding:28px 22px;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.03) inset,
    0 40px 100px rgba(0,0,0,.6),
    0 0 60px rgba(255,0,51,.06);
  animation:fadeUp .9s cubic-bezier(.16,1,.3,1) .05s both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}

.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:24px 24px 0 0;
  background:linear-gradient(90deg,transparent,var(--r) 20%,var(--w) 50%,var(--y) 80%,transparent);
  background-size:200% 100%;
  animation:borderSlide 3s linear infinite;
}
@keyframes borderSlide{from{background-position:200% 0}to{background-position:-200% 0}}

.field-label{
  font-size:.64rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  color:var(--txt3);margin-bottom:10px;
  display:flex;align-items:center;gap:8px;
}
.field-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.06),transparent)}

/* INPUT */
.input-row{position:relative;margin-bottom:14px}

.url-input{
  width:100%;
  padding:15px 52px 15px 18px;
  border-radius:13px;border:1px solid rgba(255,255,255,.08);
  background:rgba(0,0,0,.4);color:var(--txt);
  font-family:'DM Sans',sans-serif;font-size:.95rem;font-weight:500;
  outline:none;
  transition:border-color .25s,box-shadow .25s,background .25s;
  -webkit-appearance:none;
}
.url-input:focus{
  border-color:rgba(255,0,51,.5);
  background:rgba(255,0,51,.04);
  box-shadow:0 0 0 3px rgba(255,0,51,.12),0 0 20px rgba(255,0,51,.07);
}
.url-input::placeholder{color:rgba(255,255,255,.14)}

.paste-btn{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:rgba(255,0,51,.1);border:1px solid rgba(255,0,51,.22);
  border-radius:9px;color:var(--r2);font-size:.95rem;cursor:pointer;
  padding:6px 9px;line-height:1;transition:all .2s;
}
.paste-btn:hover{background:rgba(255,0,51,.22);transform:translateY(-50%) scale(1.1)}

/* QUALITY SELECTOR */
.q-label{
  font-size:.64rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  color:var(--txt3);margin-bottom:10px;margin-top:14px;
  display:flex;align-items:center;gap:8px;
}
.q-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.06),transparent)}

.q-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px;
}

.q-btn{
  padding:11px 6px;border-radius:11px;
  border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.03);
  color:var(--txt2);cursor:pointer;
  font-family:'DM Sans',sans-serif;font-size:.72rem;font-weight:700;
  letter-spacing:.05em;text-align:center;
  transition:all .2s;
}
.q-btn.active{
  border-color:rgba(255,0,51,.45);
  background:rgba(255,0,51,.1);
  color:var(--r2);
  box-shadow:0 0 16px rgba(255,0,51,.12);
}
.q-btn:hover:not(.active){
  border-color:rgba(255,255,255,.18);
  background:rgba(255,255,255,.06);
  color:var(--txt);
}
.q-icon{font-size:1.1rem;display:block;margin-bottom:3px}

/* BTN MAIN */
.btn-main{
  width:100%;padding:16px;border-radius:14px;border:none;
  font-family:'Syne',sans-serif;font-size:1.05rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,#c00020 0%,var(--r) 50%,var(--w) 100%);
  background-size:200% 100%;
  transition:all .3s;
  box-shadow:0 4px 28px rgba(255,0,51,.3),0 0 0 1px rgba(255,255,255,.06) inset;
  position:relative;overflow:hidden;
}
.btn-main::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.1),transparent);
  opacity:0;transition:opacity .2s;
}
.btn-main:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 40px rgba(255,0,51,.45),0 0 0 1px rgba(255,255,255,.1) inset;
  background-position:100% 0;
}
.btn-main:hover::after{opacity:1}
.btn-main:active{transform:translateY(0)}
.btn-main:disabled{opacity:.35;cursor:not-allowed;transform:none!important;box-shadow:none}

/* STATUS */
.status-box{
  display:none;margin-top:14px;
  padding:13px 16px;border-radius:12px;
  font-size:.88rem;font-weight:600;line-height:1.6;
  animation:fadeUp .3s ease;
}
.s-loading{background:rgba(255,204,0,.06);border:1px solid rgba(255,204,0,.18);color:var(--y2)}
.s-ok{background:rgba(0,220,130,.06);border:1px solid rgba(0,220,130,.2);color:#00dc82}
.s-error{background:rgba(255,0,51,.07);border:1px solid rgba(255,0,51,.2);color:var(--r2)}

/* PROGRESS */
.progress-wrap{
  display:none;margin-top:10px;
  height:3px;border-radius:99px;
  background:rgba(255,255,255,.06);overflow:hidden;
}
.progress-fill{
  height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--r),var(--w),var(--y));
  background-size:200% 100%;
  transition:width .4s ease;width:0%;
  animation:shimmer 2s linear infinite;
}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}

/* FEATURES */
.features{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px;
}
.feat{
  text-align:center;padding:14px 8px;
  background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);
  border-radius:14px;transition:border-color .2s,background .2s;
}
.feat:hover{border-color:rgba(255,0,51,.2);background:rgba(255,0,51,.03)}
.feat-icon{font-size:1.5rem;display:block;margin-bottom:5px}
.feat-txt{font-size:.6rem;color:var(--txt3);letter-spacing:.08em;font-weight:700;line-height:1.55;text-transform:uppercase}

/* RESULT */
.result-box{
  display:none;margin-top:18px;
  border:1px solid rgba(255,255,255,.07);border-radius:18px;overflow:hidden;
  background:rgba(0,0,0,.25);
  animation:fadeUp .5s cubic-bezier(.16,1,.3,1);
}

.thumb-wrap{
  position:relative;width:100%;aspect-ratio:16/9;
  background:var(--bg3);overflow:hidden;
}
.thumb-img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85;transition:opacity .3s}
.thumb-img:hover{opacity:1}
.thumb-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(8,8,15,.8) 0%,transparent 55%);
}
.thumb-play{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:56px;height:56px;
  background:rgba(255,0,51,.85);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;
  box-shadow:0 0 30px rgba(255,0,51,.5);
  pointer-events:none;
}
.thumb-badge{
  position:absolute;bottom:12px;left:14px;
  background:rgba(0,0,0,.55);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.1);border-radius:8px;
  padding:4px 11px;font-size:.66rem;font-weight:700;letter-spacing:.1em;
  color:rgba(255,255,255,.75);text-transform:uppercase;
}

.result-body{padding:18px 20px}

.result-title{
  font-family:'DM Sans',sans-serif;
  font-size:.96rem;font-weight:700;color:var(--txt);
  margin-bottom:12px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.chip{
  font-size:.68rem;color:var(--txt2);font-weight:600;letter-spacing:.05em;
  background:rgba(255,255,255,.04);padding:4px 11px;border-radius:8px;
  border:1px solid rgba(255,255,255,.07);
}
.chip b{color:var(--r2)}

/* DL BUTTONS */
.dl-grid{display:flex;flex-direction:column;gap:9px}

.dl-btn{
  width:100%;padding:14px 16px;
  border-radius:12px;border:none;cursor:pointer;
  font-family:'DM Sans',sans-serif;font-size:.87rem;font-weight:700;
  transition:all .2s;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.dl-btn:disabled{opacity:.3;cursor:not-allowed;transform:none!important}

.dl-4k{
  background:linear-gradient(135deg,rgba(255,0,51,.2),rgba(255,107,53,.14));
  border:1px solid rgba(255,0,51,.4);color:#fff;
  box-shadow:0 0 24px rgba(255,0,51,.1);
}
.dl-4k:hover{background:linear-gradient(135deg,rgba(255,0,51,.32),rgba(255,107,53,.24));transform:translateY(-2px);box-shadow:0 6px 28px rgba(255,0,51,.28)}

.dl-hd{background:rgba(0,220,130,.07);border:1px solid rgba(0,220,130,.28);color:#00dc82}
.dl-hd:hover{background:rgba(0,220,130,.14);transform:translateY(-1px)}

.dl-normal{background:rgba(255,204,0,.07);border:1px solid rgba(255,204,0,.25);color:var(--y2)}
.dl-normal:hover{background:rgba(255,204,0,.14);transform:translateY(-1px)}

.dl-audio{background:rgba(168,85,247,.07);border:1px solid rgba(168,85,247,.28);color:#c084fc}
.dl-audio:hover{background:rgba(168,85,247,.14);transform:translateY(-1px)}

.dl-left{display:flex;align-items:center;gap:11px}
.dl-icon{font-size:1.25rem;line-height:1;flex-shrink:0}
.dl-title{display:block;font-size:.85rem;font-weight:700}
.dl-sub{display:block;font-size:.67rem;opacity:.5;font-weight:500;margin-top:2px}
.dl-arr{font-size:.8rem;opacity:.4;flex-shrink:0}

.tip{
  margin-top:13px;padding:12px 14px;
  background:rgba(255,204,0,.04);border:1px solid rgba(255,204,0,.1);
  border-radius:10px;font-size:.77rem;color:rgba(255,210,60,.7);line-height:1.8;
}

/* SPINNER */
.sp{
  display:inline-block;width:13px;height:13px;
  border:2px solid rgba(255,204,0,.2);border-top-color:var(--y2);
  border-radius:50%;animation:spin .7s linear infinite;
  vertical-align:middle;margin-right:7px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* FOOTER */
.footer{
  position:relative;z-index:2;
  margin-top:28px;text-align:center;
  font-size:.65rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(255,255,255,.1);
}
.footer span{color:var(--r)}
</style>
</head>
<body>

<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>

<div class="header">
  <div class="logo">
    <div class="logo-bg"></div>
    <div class="logo-face">▶️</div>
  </div>
  <div class="brand">YouTube DL</div>
  <div class="tagline">The Cris IF Edition</div>
  <div class="pills">

    <div class="pill">🚫 Sin ads</div>

  </div>
</div>

<div class="card">
  <div class="field-label">🔗 Enlace del video</div>
  <div class="input-row">
    <input class="url-input" id="url-input" type="text"
      placeholder="https://www.youtube.com/watch?v=..."
      onkeydown="if(event.key==='Enter')buscar()">
    <button class="paste-btn" onclick="pegar()" title="Pegar">📋</button>
  </div>

  <div class="q-label">⚙️ Calidad</div>
  <div class="q-grid">
    <button class="q-btn active" data-q="1080">
      <span class="q-icon">🔥</span>1080p
    </button>
    <button class="q-btn" data-q="720">
      <span class="q-icon">📹</span>720p
    </button>
    <button class="q-btn" data-q="480">
      <span class="q-icon">📱</span>480p
    </button>
    <button class="q-btn" data-q="audio">
      <span class="q-icon">🎵</span>Audio
    </button>
  </div>

  <button class="btn-main" id="btn-main" onclick="buscar()">
    ⬇️ &nbsp;Obtener Video
  </button>

  <div class="status-box" id="status-box"></div>
  <div class="progress-wrap" id="progress-wrap">
    <div class="progress-fill" id="progress-fill"></div>
  </div>
  <div class="result-box" id="result-box"></div>

  <div class="features">
    <div class="feat"><span class="feat-icon">🎬</span><div class="feat-txt">Videos<br>completos</div></div>
    <div class="feat"><span class="feat-icon">🎵</span><div class="feat-txt">Audio<br>MP3</div></div>
    <div class="feat"><span class="feat-icon">⚡</span><div class="feat-txt">Rápido<br>y gratis</div></div>
  </div>
</div>

<div class="footer">Hecho con ❤️ por <span>THE CRIS IF</span></div>

<script>
var working = false;
var selectedQ = '1080';

/* Quality buttons */
document.querySelectorAll('.q-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.q-btn').forEach(function(b){ b.classList.remove('active'); });
    this.classList.add('active');
    selectedQ = this.dataset.q;
  });
});

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function pegar() {
  try {
    var t = await navigator.clipboard.readText();
    if (t) document.getElementById('url-input').value = t.trim();
  } catch(e) { document.getElementById('url-input').select(); }
}

function setStatus(cls, html) {
  var el = document.getElementById('status-box');
  el.className = 'status-box ' + cls;
  el.innerHTML = html;
  el.style.display = 'block';
}

function setProgress(v) {
  var w = document.getElementById('progress-wrap');
  var f = document.getElementById('progress-fill');
  if (v === null) { w.style.display='none'; f.style.width='0%'; return; }
  w.style.display='block'; f.style.width=v+'%';
}

function fname(tipo) {
  return 'crisif_yt_' + Date.now() + (tipo==='audio' ? '.mp3' : '.mp4');
}

function isValidYT(url) {
  return /youtube\.com\/watch|youtu\.be\/|youtube\.com\/shorts/i.test(url);
}

/* Obtener info del video via oEmbed (sin API key) */
async function getVideoInfo(url) {
  try {
    var r = await fetch('https://www.youtube.com/oembed?url=' + encodeURIComponent(url) + '&format=json');
    if (!r.ok) throw new Error('oEmbed fail');
    var d = await r.json();
    return {
      titulo: d.title || 'Video de YouTube',
      autor: d.author_name || '',
      thumb: d.thumbnail_url || ''
    };
  } catch(e) {
    return { titulo: 'Video de YouTube', autor: '', thumb: '' };
  }
}

/* Descargar con Blob */
async function dlBlob(url, filename, btn) {
  if (!url || !btn) return;
  var origTitle = btn.querySelector('.dl-title').textContent;
  btn.disabled = true;
  btn.querySelector('.dl-title').textContent = '⏳ Descargando...';
  setProgress(15);

  var mime = filename.endsWith('.mp3') ? 'audio/mpeg' : 'video/mp4';
  var blob = null;

  // Método 1: directo
  try {
    var r = await fetch(url, { mode:'cors' });
    if (r.ok) {
      setProgress(50);
      var b = await r.blob();
      if (b.size > 5000) blob = new Blob([b], { type: mime });
    }
  } catch(e) {}

  // Método 2: allorigins proxy
  if (!blob) {
    try {
      setProgress(35);
      var r2 = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url));
      if (r2.ok) {
        setProgress(65);
        var b2 = await r2.blob();
        if (b2.size > 5000) blob = new Blob([b2], { type: mime });
      }
    } catch(e) {}
  }

  // Método 3: corsproxy
  if (!blob) {
    try {
      setProgress(45);
      var r3 = await fetch('https://corsproxy.io/?' + encodeURIComponent(url));
      if (r3.ok) {
        setProgress(75);
        var b3 = await r3.blob();
        if (b3.size > 5000) blob = new Blob([b3], { type: mime });
      }
    } catch(e) {}
  }

  setProgress(90);

  if (blob && blob.size > 5000) {
    var burl = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href=burl; a.download=filename; a.style.display='none';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(burl); }, 15000);
    setProgress(100);
    setTimeout(function(){ setProgress(null); }, 1500);
    btn.querySelector('.dl-title').textContent = '✅ ¡Guardado!';
    setTimeout(function(){ btn.querySelector('.dl-title').textContent = origTitle; btn.disabled=false; }, 3500);
  } else {
    setProgress(null);
    window.open(url, '_blank');
    btn.querySelector('.dl-title').textContent = '🔗 Abierto — guardar manualmente';
    setTimeout(function(){ btn.querySelector('.dl-title').textContent = origTitle; btn.disabled=false; }, 4000);
  }
}

function mkBtn(cls, icon, title, sub, url, tipo) {
  if (!url) return null;
  var n = fname(tipo);
  var btn = document.createElement('button');
  btn.className = 'dl-btn ' + cls;
  btn.dataset.url = url;
  btn.dataset.name = n;
  btn.innerHTML =
    '<div class="dl-left">'
    + '<span class="dl-icon">'+icon+'</span>'
    + '<div><span class="dl-title">'+title+'</span><span class="dl-sub">'+sub+'</span></div>'
    + '</div><span class="dl-arr">⬇</span>';
  btn.addEventListener('click', function(){ dlBlob(this.dataset.url, this.dataset.name, this); });
  return btn;
}

function render(info, urls) {
  var box = document.getElementById('result-box');
  box.innerHTML = '';

  /* Thumbnail */
  if (info.thumb) {
    box.innerHTML =
      '<div class="thumb-wrap">'
      + '<img class="thumb-img" src="'+esc(info.thumb)+'" loading="lazy" '
      + 'onerror="this.closest(\'.thumb-wrap\').style.display=\'none\'">'
      + '<div class="thumb-overlay"></div>'
      + '<div class="thumb-play">▶</div>'
      + '<span class="thumb-badge">▶ YouTube</span>'
      + '</div>';
  }

  var body = document.createElement('div');
  body.className = 'result-body';

  /* Título */
  var t = document.createElement('div');
  t.className = 'result-title';
  t.textContent = info.titulo;
  body.appendChild(t);

  /* Chips */
  var chips = [];
  if (info.autor) chips.push('👤 <b>'+esc(info.autor)+'</b>');
  chips.push('🔌 <b>cobalt.tools</b>');
  if (chips.length) {
    var mr = document.createElement('div'); mr.className='chips';
    chips.forEach(function(c){ var s=document.createElement('span'); s.className='chip'; s.innerHTML=c; mr.appendChild(s); });
    body.appendChild(mr);
  }

  /* Botones */
  var grid = document.createElement('div'); grid.className='dl-grid';

  if (urls.video1080) {
    var b = mkBtn('dl-4k','🔥','Descargar 1080p HD','Máxima calidad disponible',urls.video1080,'video');
    if (b) grid.appendChild(b);
  }
  if (urls.video720 && urls.video720 !== urls.video1080) {
    var b2 = mkBtn('dl-hd','📹','Descargar 720p','Buena calidad, menos peso',urls.video720,'video');
    if (b2) grid.appendChild(b2);
  }
  if (urls.video480 && urls.video480 !== urls.video720) {
    var b3 = mkBtn('dl-normal','📱','Descargar 480p','Si los anteriores fallan',urls.video480,'video');
    if (b3) grid.appendChild(b3);
  }
  if (urls.audio) {
    var b4 = mkBtn('dl-audio','🎵','Solo Audio (MP3)','Música sin imagen',urls.audio,'audio');
    if (b4) grid.appendChild(b4);
  }

  body.appendChild(grid);

  var tip = document.createElement('div'); tip.className='tip';
  tip.innerHTML = '⚠️ <b>¿No descarga?</b> YouTube protege los videos — si un botón falla prueba el siguiente.<br>💡 Si el video se <b>abre en el navegador</b>, mantén presionado → "Guardar video"';
  body.appendChild(tip);

  box.appendChild(body);
  box.style.display = 'block';
}

/* cobalt.tools API */
async function fetchCobalt(url, quality, mode) {
  var body = { url: url };
  if (mode === 'audio') {
    body.downloadMode = 'audio';
    body.audioFormat = 'mp3';
    body.audioBitrate = '320';
  } else {
    body.downloadMode = 'auto';
    body.videoQuality = quality;
  }
  body.filenameStyle = 'pretty';

  var r = await fetch('https://api.cobalt.tools/', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Accept': 'application/json'
    },
    body: JSON.stringify(body)
  });

  if (!r.ok) throw new Error('HTTP ' + r.status);
  var j = await r.json();

  if (j.status === 'error') throw new Error(j.error ? j.error.code : 'error');
  if (j.status === 'rate-limit') throw new Error('rate-limit');
  if (j.status === 'stream' || j.status === 'redirect') return j.url;
  if (j.status === 'picker' && j.picker && j.picker.length) return j.picker[0].url;

  throw new Error('Sin URL en respuesta');
}

async function buscar() {
  if (working) return;
  var url = document.getElementById('url-input').value.trim();
  var btn = document.getElementById('btn-main');

  if (!url) { setStatus('s-error','❌ Pega un enlace de YouTube primero'); return; }
  if (!isValidYT(url)) { setStatus('s-error','❌ El enlace debe ser de YouTube (youtube.com o youtu.be)'); return; }

  working = true;
  btn.disabled = true;
  document.getElementById('result-box').style.display = 'none';
  setProgress(null);
  setStatus('s-loading','<span class="sp"></span> Obteniendo información del video...');

  /* Obtener info (título, miniatura) */
  setProgress(10);
  var info = await getVideoInfo(url);
  setProgress(20);

  /* Obtener URLs de descarga */
  var urls = { video1080: null, video720: null, video480: null, audio: null };
  var error = null;

  setStatus('s-loading','<span class="sp"></span> Generando links de descarga...');

  /* Si seleccionó audio, solo buscar audio */
  if (selectedQ === 'audio') {
    try {
      setProgress(40);
      urls.audio = await fetchCobalt(url, null, 'audio');
      setProgress(80);
    } catch(e) { error = e.message; }
  } else {
    /* Buscar todas las calidades en paralelo */
    var promises = [
      fetchCobalt(url, '1080', 'video').then(function(u){ urls.video1080 = u; }).catch(function(){}),
      fetchCobalt(url, '720',  'video').then(function(u){ urls.video720  = u; }).catch(function(){}),
      fetchCobalt(url, '480',  'video').then(function(u){ urls.video480  = u; }).catch(function(){}),
      fetchCobalt(url, null,   'audio').then(function(u){ urls.audio     = u; }).catch(function(){})
    ];
    setProgress(40);
    await Promise.allSettled(promises);
    setProgress(85);
  }

  setProgress(null);

  var tieneAlgo = urls.video1080 || urls.video720 || urls.video480 || urls.audio;

  if (tieneAlgo) {
    setStatus('s-ok', '✅ Video encontrado — <b>' + esc(info.titulo.substring(0,40)) + (info.titulo.length > 40 ? '...' : '') + '</b>');
    render(info, urls);
  } else {
    setStatus('s-error',
      '❌ No se pudo obtener el video.<br>'
      + '<small style="opacity:.65">' + esc(error || 'cobalt.tools no respondió') + '</small><br>'
      + '<small style="opacity:.5">Puede ser un video privado, restringido por edad o región.</small>'
    );
  }

  working = false;
  btn.disabled = false;
}
